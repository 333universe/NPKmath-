[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npkmath"
version = "1.0.0"
description = "A Self-Improving AI Knowledge & Mathematical Verification Engine."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "333universe"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "sympy>=1.12",
    "mpmath>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6.0",
    "build>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=npkmath --cov-report=term-missing --cov-report=xml"

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = ["npkmath"]

[tool.setuptools.package-dir]
"" = "src"
